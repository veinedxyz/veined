# Otherbridge-only local data stack. Unique project/container/volume names; loopback-bound port.
# Credentials come from the git-ignored .env.data.local generated by `pnpm data:db:init`.
# No default password is committed. Never use this file for production.
name: otherbridge-data
services:
  postgres:
    image: postgres:17-alpine
    container_name: otherbridge-data-postgres
    restart: "no"
    environment:
      POSTGRES_USER: otherbridge_owner
      POSTGRES_PASSWORD: ${OTHERBRIDGE_PG_OWNER_PASSWORD:?run pnpm data:db:init}
      POSTGRES_DB: otherbridge_data
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:55471:5432"
    volumes:
      - otherbridge-data-pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=60
      - -c
      - statement_timeout=30000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otherbridge_owner -d otherbridge_data"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [otherbridge-data]
networks:
  otherbridge-data:
    name: otherbridge-data-net
volumes:
  otherbridge-data-pgdata:
    name: otherbridge-data-pgdata
