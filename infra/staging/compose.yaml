# Otherbridge V1.5 local staging-equivalent stack. Production security semantics, local only:
# - only the TLS ingress (127.0.0.1:8443) and the monitoring UIs are published, all on loopback;
# - PostgreSQL sits on an internal network with no published port;
# - services run as non-root (where the image allows), read-only root filesystems, tmpfs scratch,
#   all Linux capabilities dropped, no-new-privileges, healthchecks and resource bounds;
# - secrets come from the git-ignored .env.staging.local / secrets/ generated by `node scripts/staging.mjs init`.
# Never use this file for a public deployment. No real signing, approval, broadcast or deploy exists.
name: otherbridge-staging
x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  # Long-running services recover on their own after a dependency outage (e.g. the indexer exits
  # fail-fast when PostgreSQL is unreachable); one-shot jobs override this with "no".
  restart: unless-stopped
x-app-image: &app_image
  image: otherbridge-staging-app:v15
  build:
    context: ../..
    dockerfile: infra/staging/Dockerfile
x-node-env: &node_env
  NODE_ENV: production
  OTHERBRIDGE_MODE: mainnet-readonly
  OTHERBRIDGE_DEPLOYMENT_ENV: staging
  OTHERBRIDGE_PUBLIC_DEPLOYMENT: "true"
  # Non-public staging hosts: required for the staging RPC profile in public mode.
  OTHERBRIDGE_APP_ORIGINS: https://app.otherbridge.localhost:8443
  OTHERBRIDGE_RATE_LIMIT_BACKEND: postgres
  OTHERBRIDGE_DATA_LOG: "on"
services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: otherbridge-staging-postgres
    user: "70:70"
    environment:
      POSTGRES_USER: otherbridge_owner
      POSTGRES_PASSWORD: ${OTHERBRIDGE_PG_OWNER_PASSWORD:?run node scripts/staging.mjs init}
      POSTGRES_DB: otherbridge_data
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "max_connections=80", "-c", "statement_timeout=30000", "-c", "listen_addresses=*"]
    tmpfs: ["/var/run/postgresql:mode=1777", "/tmp"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [backend]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otherbridge_owner -d otherbridge_data"]
      interval: 3s
      timeout: 3s
      retries: 40
  migrate:
    <<: [*hardening, *app_image]
    container_name: otherbridge-staging-migrate
    restart: "no"
    command: ["sh", "-c", "node scripts/data.mjs db:migrate && node scripts/data.mjs chains:sync && node scripts/data.mjs rpc:seed-snapshot && node scripts/data.mjs rpc:sync --chains 42161,43114,57073,480 --approve-per-chain 4 --max-probes 6 --no-public-registry"]
    environment:
      <<: *node_env
      OTHERBRIDGE_DATA_MIGRATOR_URL: postgres://otherbridge_owner:${OTHERBRIDGE_PG_OWNER_PASSWORD}@postgres:5432/otherbridge_data
      OTHERBRIDGE_DATA_INDEXER_URL: postgres://otherbridge_indexer:${OTHERBRIDGE_PG_INDEXER_PASSWORD}@postgres:5432/otherbridge_data
      OTHERBRIDGE_PG_API_PASSWORD: ${OTHERBRIDGE_PG_API_PASSWORD}
      OTHERBRIDGE_PG_INDEXER_PASSWORD: ${OTHERBRIDGE_PG_INDEXER_PASSWORD}
      OTHERBRIDGE_PG_MONITOR_PASSWORD: ${OTHERBRIDGE_PG_MONITOR_PASSWORD}
      OTHERBRIDGE_PG_BACKUP_PASSWORD: ${OTHERBRIDGE_PG_BACKUP_PASSWORD}
    tmpfs: ["/tmp"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, egress]
    mem_limit: 768m
    cpus: 1
  app:
    <<: [*hardening, *app_image]
    container_name: otherbridge-staging-app
    environment:
      <<: *node_env
      OTHERBRIDGE_APP_ORIGINS: https://app.otherbridge.localhost:8443
      OTHERBRIDGE_TRUST_PROXY_HOPS: "1"
      OTHERBRIDGE_DATA_DATABASE_URL: postgres://otherbridge_api:${OTHERBRIDGE_PG_API_PASSWORD}@postgres:5432/otherbridge_data
      OTHERBRIDGE_DATA_PSEUDONYM_KEY: ${OTHERBRIDGE_DATA_PSEUDONYM_KEY}
      OTHERBRIDGE_METRICS_PORT: "3291"
      OTHERBRIDGE_METRICS_HOST: 0.0.0.0
      OTHERBRIDGE_METRICS_TOKEN: ${OTHERBRIDGE_METRICS_TOKEN}
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge, backend, egress]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
  data-api:
    <<: [*hardening, *app_image]
    container_name: otherbridge-staging-data-api
    command: ["node", "scripts/data.mjs", "api"]
    environment:
      <<: *node_env
      OTHERBRIDGE_DATA_API_PORT: "3200"
      OTHERBRIDGE_DATA_API_BIND: 0.0.0.0
      OTHERBRIDGE_DATA_API_HOSTS: api.otherbridge.localhost:8443
      OTHERBRIDGE_DATA_DATABASE_URL: postgres://otherbridge_api:${OTHERBRIDGE_PG_API_PASSWORD}@postgres:5432/otherbridge_data
      OTHERBRIDGE_DATA_PSEUDONYM_KEY: ${OTHERBRIDGE_DATA_PSEUDONYM_KEY}
      OTHERBRIDGE_TRUST_PROXY_HOPS: "1"
      OTHERBRIDGE_APP_ORIGINS: https://app.otherbridge.localhost:8443
      OTHERBRIDGE_METRICS_PORT: "3292"
      OTHERBRIDGE_METRICS_HOST: 0.0.0.0
      OTHERBRIDGE_METRICS_TOKEN: ${OTHERBRIDGE_METRICS_TOKEN}
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge, backend, egress]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/v1/health',{headers:{host:'127.0.0.1:3200'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
  indexer:
    <<: [*hardening, *app_image]
    container_name: otherbridge-staging-indexer
    command: ["node", "scripts/data.mjs", "indexer:run", "--witness", "required", "--interval", "30", "--max-windows", "20"]
    environment:
      <<: *node_env
      OTHERBRIDGE_DATA_INDEXER_URL: postgres://otherbridge_indexer:${OTHERBRIDGE_PG_INDEXER_PASSWORD}@postgres:5432/otherbridge_data
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]
    mem_limit: 768m
    cpus: 1
  rpc-health:
    <<: [*hardening, *app_image]
    container_name: otherbridge-staging-rpc-health
    command: ["sh", "-c", "while true; do node scripts/data.mjs rpc:health --chains 42161,43114,57073,480; sleep 300; done"]
    environment:
      <<: *node_env
      OTHERBRIDGE_DATA_INDEXER_URL: postgres://otherbridge_indexer:${OTHERBRIDGE_PG_INDEXER_PASSWORD}@postgres:5432/otherbridge_data
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend, egress]
    mem_limit: 384m
    cpus: 0.5
  ops-exporter:
    <<: [*hardening, *app_image]
    container_name: otherbridge-staging-ops-exporter
    command: ["node", "scripts/data.mjs", "ops-exporter"]
    environment:
      NODE_ENV: production
      OTHERBRIDGE_OPS_METRICS_PORT: "3293"
      OTHERBRIDGE_METRICS_HOST: 0.0.0.0
      OTHERBRIDGE_METRICS_TOKEN: ${OTHERBRIDGE_METRICS_TOKEN}
      OTHERBRIDGE_DATA_MONITOR_URL: postgres://otherbridge_monitor:${OTHERBRIDGE_PG_MONITOR_PASSWORD}@postgres:5432/otherbridge_data
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3293/metrics',{headers:{authorization:'Bearer '+process.env.OTHERBRIDGE_METRICS_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  proxy:
    <<: *hardening
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: otherbridge-staging-proxy
    # The caddy binary carries a file capability (setcap cap_net_bind_service); exec fails with
    # EPERM unless that capability stays in the bounding set. no-new-privileges still prevents the
    # process from gaining it, and the listener uses an unprivileged port (8443).
    cap_add: ["NET_BIND_SERVICE"]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - otherbridge-staging-caddy-data:/data
      - otherbridge-staging-caddy-config:/config
    tmpfs: ["/tmp"]
    depends_on:
      app: { condition: service_healthy }
      data-api: { condition: service_healthy }
    networks: [edge]
    mem_limit: 128m
    cpus: 0.5
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    container_name: otherbridge-staging-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.listen-address=0.0.0.0:9090"]
    ports: ["127.0.0.1:59090:9090"]
    volumes:
      - ../monitoring/prometheus/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - otherbridge-staging-prometheus:/prometheus
    networks: [backend, monitoring]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: otherbridge-staging-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    ports: ["127.0.0.1:59093:9093"]
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - otherbridge-staging-alertmanager:/alertmanager
    networks: [backend, monitoring]
    mem_limit: 128m
    cpus: 0.5
  grafana:
    <<: *hardening
    image: grafana/grafana-oss:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    container_name: otherbridge-staging-grafana
    ports: ["127.0.0.1:53000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: otherbridge-admin
      GF_SECURITY_ADMIN_PASSWORD: ${OTHERBRIDGE_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - otherbridge-staging-grafana:/var/lib/grafana
    tmpfs: ["/tmp"]
    networks: [monitoring]
    mem_limit: 512m
    cpus: 1
networks:
  # Ingress-facing services.
  edge:
    name: otherbridge-staging-edge
  # Database and internal metrics: no route outside the stack.
  backend:
    name: otherbridge-staging-backend
    internal: true
  # Outbound-only internet for public read-only RPC and routing quotes.
  egress:
    name: otherbridge-staging-egress
  monitoring:
    name: otherbridge-staging-monitoring
volumes:
  # Drill D (restore) switches the stack to a NEW volume holding the restored copy; the previous
  # volume is never deleted by the drill.
  pgdata:
    name: ${OTHERBRIDGE_STAGING_PG_VOLUME:-otherbridge-staging-pgdata}
  otherbridge-staging-caddy-data:
    name: otherbridge-staging-caddy-data
  otherbridge-staging-caddy-config:
    name: otherbridge-staging-caddy-config
  otherbridge-staging-prometheus:
    name: otherbridge-staging-prometheus
  otherbridge-staging-alertmanager:
    name: otherbridge-staging-alertmanager
  otherbridge-staging-grafana:
    name: otherbridge-staging-grafana
