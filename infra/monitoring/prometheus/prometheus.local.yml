# Otherbridge local monitoring profile: scrapes services running on the developer host through the
# Docker Desktop host gateway. Metrics listeners stay loopback-only on the host and token-protected.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-dev
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: otherbridge-app
    authorization: { type: Bearer, credentials_file: /etc/prometheus/secrets/metrics_token }
    static_configs: [{ targets: ["host.docker.internal:3291"] }]
  - job_name: otherbridge-data-api
    authorization: { type: Bearer, credentials_file: /etc/prometheus/secrets/metrics_token }
    static_configs: [{ targets: ["host.docker.internal:3292"] }]
  - job_name: otherbridge-ops
    authorization: { type: Bearer, credentials_file: /etc/prometheus/secrets/metrics_token }
    static_configs: [{ targets: ["host.docker.internal:3293"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
